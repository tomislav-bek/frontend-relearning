<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Navigation and Global Attributes</title>
</head>

<body>

	<!-- THE LINK (The Start) -->
	<!-- The '#' symbol tells the browser to look for a unique ID on this same page -->
	<!-- Added a class attribute to group this link with other primary links later -->
	<a href="#target-heading" class="site-link">Jump to the bottom of the page</a>

	<!-- THE SPACING (Simulating a long webpage) -->
	<div style="margin-top: 1200px;">
		<p>This empty space is here to make the page scrollable...</p>
	</div>

	<!-- THE TARGET (The Destination) -->
	<!-- This heading has a unique ID attribute that matches the link above -->
	<h2 id="target-heading">You successfully jumped to the destination!</h2>

	<!-- REUSING THE CLASS -->
	<!-- Added the same class here to show that classes can be used multiple times -->
	<p class="site-link">This paragraph shares the same class as the link above.</p>

</body>

</html>
