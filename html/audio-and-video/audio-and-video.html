<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Audio and Video</title>
</head>

<body>

	<!-- 1. Basic Video Player with Multiple Source Fallbacks -->
	<video controls width="400" preload="metadata">
		<source src="https://w3schools.com" type="video/mp4">
		Your browser does not support the video tag.
	</video>

	<!-- 2. Basic Audio Player -->
	<audio controls preload="metadata">
		<source src="https://w3schools.com" type="video/mp3">
		Your browser does not support the audio element.
	</audio>

	<!-- 3. Advanced Video Player (Autoplay, Muted, Loop, Poster Image) -->
	<video controls autoplay muted loop poster="https://w3schools.com" width="400">
		<source src="https://w3schools.com" type="video/mp4">
		Your browser does not support the video tag.
	</video>

</body>

</html>
