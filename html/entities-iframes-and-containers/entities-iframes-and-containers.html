<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Containers, Iframes, and Entities</title>
</head>

<body>

	<!-- 1. CONTAINER SECTION -->
	<!-- This div acts as a clean, isolated box to group related elements together -->
	<div>
		<h1>Containers, Iframes, and Entities</h1>
		<p>This entire heading and paragraph are grouped inside a single div container.</p>
	</div>

	<hr>

	<!-- 2. INLINE FRAME SECTION -->
	<!-- This iframe opens a functional window inside your page -->
	<!-- It loads your existing general-notes.md file to show how an iframe displays content -->
	<div>
		<h2>Embedded Content via Iframe</h2>
		<iframe src="../../general-notes.md" width="500" height="300"></iframe>
	</div>

	<hr>

	<!-- 3. HTML ENTITIES SECTION -->
	<!-- Using &lt; and &gt; to display raw text symbols safely without breaking the browser -->
	<div>
		<h2>Special Characters and Entities</h2>
		<p>To write a paragraph tag in plain text, you must write it like this: &lt;p&gt;Hello&lt;/p&gt;</p>
		<p>The math equation is written as: 10 &lt; 20</p>
	</div>

</body>

</html>
