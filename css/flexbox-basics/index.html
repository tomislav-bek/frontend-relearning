<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flexbox Basics</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<!-- SECTION 1: JUSTIFY-CONTENT (Main Axis) -->
	<h1>1. justify-content (Main Axis Control)</h1>

	<div class="flex-container justify-center">
		<div class="box">1</div>
		<div class="box">2</div>
		<div class="box">3</div>
	</div>

	<div class="flex-container justify-between">
		<div class="box">1</div>
		<div class="box">2</div>
		<div class="box">3</div>
	</div>

	<!-- SECTION 2: ALIGN-ITEMS (Cross Axis) -->
	<h1>2. align-items (Cross Axis Control)</h1>

	<div class="flex-container tall align-center">
		<div class="box">Centered</div>
	</div>

	<!-- SECTION 3: FLEX-DIRECTION -->
	<h1>3. flex-direction (Changing the Main Axis)</h1>

	<div class="flex-container column">
		<div class="box">1</div>
		<div class="box">2</div>
		<div class="box">3</div>
	</div>

</body>

</html>
