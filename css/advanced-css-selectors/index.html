<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Advanced CSS Selectors</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<!-- Grouping and Sibling relationships -->
	<h1>Advanced Selectors Guide</h1>
	<p>This paragraph is directly after the h1 heading.</p>
	<p>This is a normal paragraph on the page.</p>

	<!-- Descendant and Child relationships -->
	<article>
		<h2>Article Heading</h2>
		<p>This paragraph is a direct child of the article.</p>
		<div>
			<p>This paragraph is nested deeper inside a div.</p>
		</div>
	</article>

	<!-- Attributes and States -->
	<p>
		<a href="https://google.com">Hover your mouse over this link!</a>
	</p>

	<form>
		<input type="email" placeholder="Enter your email...">
	</form>

</body>

</html>
